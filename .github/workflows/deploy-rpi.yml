name: CD Self-Hosted Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-self-hosted
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env from GitHub Secret
        shell: bash
        run: |
          if [ -z "${{ secrets.APP_ENV_FILE }}" ]; then
            echo "Missing required secret APP_ENV_FILE"
            exit 1
          fi
          cat > .env << 'EOF'
          ${{ secrets.APP_ENV_FILE }}
          EOF
          chmod 600 .env

      - name: Build and start containers
        run: docker compose up -d --build --remove-orphans

      - name: Show running containers
        run: docker compose ps
