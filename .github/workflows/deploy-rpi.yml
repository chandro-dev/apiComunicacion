name: RPi Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env from GitHub Secret
        shell: bash
        run: |
          if [ -z "${{ secrets.APP_ENV_FILE }}" ]; then
            echo "Missing required secret APP_ENV_FILE"
            exit 1
          fi
          printf "%s\n" "${{ secrets.APP_ENV_FILE }}" > .env
          chmod 600 .env

      - name: Deploy with Docker Compose
        run: docker compose up -d --build --remove-orphans

      - name: Show container status
        run: docker compose ps
